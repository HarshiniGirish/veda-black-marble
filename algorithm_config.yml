# OGC Application Package / MAAP DPS algorithm configuration
# Compatible with MAAP Register Algorithm UI and ogc-app-pack-generator.
#
# Auth: DPS injects MAAP_PGT; algorithm uses maap-py (no Earthdata token input).
algorithm_description: >
  VEDA Black Marble nighttime-lights pipeline: combines VIIRS VNP46A2 with
  Landsat and OSM roads to produce urban-focused Cloud-Optimized GeoTIFF
  imagery for a user bbox and date. On MAAP, auth uses maap-py + MAAP_PGT.
algorithm_name: veda-black-marble
algorithm_version: main
keywords: ogc, black-marble, viirs, landsat, nighttime-lights, veda, maap
code_repository: https://github.com/HarshiniGirish/veda-black-marble.git
repository_url: https://github.com/HarshiniGirish/veda-black-marble.git
citation: https://github.com/HarshiniGirish/veda-black-marble
author: NASA-IMPACT
contributor: HarshiniGirish
license: https://github.com/HarshiniGirish/veda-black-marble/blob/main/LICENSE
release_notes: OGC/DPS packaging; Earthdata via maap-py/MAAP_PGT (no token CLI).
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v6.0.0
disk_space: 40GB
queue: maap-dps-worker-16gb
build_command: veda-black-marble/build.sh
run_command: /opt/app/run.sh
ram_min: 8192
cores_min: 2
outdir_max: 4096

inputs:
  - name: bbox
    doc: Bounding box as min_lon,min_lat,max_lon,max_lat (WGS84). Lat span must be >= 0.05 deg.
    label: bounding box
    type: string
  - name: date
    doc: Target date YYYY-MM-DD
    label: date
    type: string
  - name: config
    doc: Preset — default, high_quality, or fast
    label: config preset
    type: string?
  - name: osm_source
    doc: OSM backend — overpass or layercake
    label: OSM source
    type: string?
  - name: wgs84
    doc: Also export EPSG:4326 (true/false)
    label: WGS84 export
    type: string?
  - name: basename
    doc: >
      Output filename stem written as output/<basename>.tif
      (maps to blackmarble --output-path).
    label: basename
    type: string?

outputs:
  - name: out
    type: Directory
